<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Production Performance Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>

<style>
:root {
  --bg:#eef3f8;
  --card:#fff;
  --ink:#152238;
  --muted:#64748b;
  --nav:#10253f;
  --accent:#1776d2;
  --good:#16945a;
  --danger:#d63d52;
  --gold:#d08b19;
  --line:#d9e2ec;
}

* { box-sizing:border-box; }

body {
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:Segoe UI,Arial,sans-serif;
}

button {
  font:inherit;
}

.header {
  position:sticky;
  top:0;
  z-index:10;
  background:linear-gradient(135deg,#10253f,#1a4d77);
  color:#fff;
  padding:18px 24px;
  box-shadow:0 3px 14px #10253f33;
}

.header-row {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.brand {
  font-size:22px;
  font-weight:800;
}

.sub {
  font-size:12px;
  color:#d8e6f2;
  margin-top:4px;
}

.wrap {
  max-width:1440px;
  margin:auto;
  padding:22px;
}

.navbtn {
  border:1px solid #c9d5e2;
  background:#fff;
  color:#20324b;
  border-radius:10px;
  padding:9px 14px;
  cursor:pointer;
  font-weight:700;
}

.navbtn:hover {
  background:#e7f1fb;
  border-color:#9bbddd;
}

.detail-nav {
  position:sticky; top:10px; z-index:50;
  display:flex; flex-wrap:wrap; gap:8px;
  padding:10px 12px; margin-bottom:14px;
  background:rgba(255,255,255,.96);
  border:1px solid #d6e2ed; border-radius:14px;
  box-shadow:0 6px 18px rgba(23,60,95,.08);
  backdrop-filter:blur(8px);
}
.detail-nav .navbtn { padding:8px 12px; font-size:12px; }
.detail-nav .navbtn.active { background:#0f6fc4; color:#fff; border-color:#0f6fc4; }
.machine-brand-logo{height:54px;width:auto;object-fit:contain;display:block;margin-left:18px}
.top-brand-logo{height:58px;width:auto;object-fit:contain;display:block;margin-left:18px}.detail-nav{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.96);backdrop-filter:blur(8px)}.machine-header-row{display:flex;align-items:center;justify-content:space-between;gap:18px}.machine-header-row>div:first-child{min-width:0}.machine-brand-logo-wrap{display:flex;align-items:center;justify-content:flex-end;flex:0 0 auto}
.machine-main-stack { display:flex; flex-direction:column; gap:18px; }
.machine-main-stack .exec-card { width:100%; }
.oee-mini-values span { font-size:14px; font-weight:900; }
.oee-mini-target, .oee-mini-ytd { white-space:nowrap; }

.page {
  display:none;
}

.page.active {
  display:block;
}

.hero {
  background:var(--card);
  border:1px solid var(--line);
  border-radius:18px;
  padding:20px;
  margin-bottom:18px;
}

h1,h2,h3 {
  margin:0 0 8px;
}

.muted {
  color:var(--muted);
}



/* Modern Home UI */
.home-shell{display:grid;gap:16px}
.home-top{background:linear-gradient(135deg,#0c3157 0%,#0f5d91 58%,#1384c8 100%);border-radius:22px;padding:22px;color:#fff;box-shadow:0 14px 32px rgba(16,53,83,.20);position:relative;overflow:hidden}
.home-top:after{content:"";position:absolute;right:-80px;top:-120px;width:340px;height:340px;border-radius:50%;border:52px solid rgba(255,255,255,.08)}
.home-top-row{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;position:relative;z-index:1}
.home-brand{display:flex;align-items:center;gap:14px}.home-brand img{width:82px;height:82px;object-fit:contain;background:#fff;border-radius:14px;padding:7px}
.home-eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:1.8px;font-weight:800;opacity:.78}.home-title{font-size:32px;line-height:1.05;font-weight:900;margin:4px 0 7px}.home-subtitle{font-size:14px;opacity:.88}.home-live{padding:9px 13px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.10);border-radius:12px;text-align:right;font-size:12px;font-weight:800;white-space:nowrap}.home-live strong{display:block;font-size:18px}
.home-quote{position:relative;z-index:1;margin-top:18px;padding-top:14px;border-top:1px solid rgba(255,255,255,.18);font-size:14px;font-weight:700;letter-spacing:.2px}
.home-kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}.home-kpi{background:#fff;border:1px solid #d8e4ee;border-radius:16px;padding:13px 14px;box-shadow:0 7px 20px rgba(31,65,94,.07);position:relative;overflow:hidden}.home-kpi:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--kpi-color,#1776d2)}.home-kpi .label{font-size:10px;text-transform:uppercase;letter-spacing:.7px;font-weight:900;color:#65788b}.home-kpi .value{font-size:23px;font-weight:900;color:#173b5c;margin-top:4px}.home-kpi .meta{font-size:10px;color:#708296;margin-top:2px}.home-kpi .status{font-size:10px;font-weight:900;margin-top:6px;color:#16945a}.home-kpi .status.neutral{color:#62758a}.home-kpi .status.bad{color:#d63d52}
.home-section-title{display:flex;justify-content:space-between;align-items:end;gap:10px;margin:2px 2px 0}.home-section-title h2{font-size:21px;color:#163b5e;margin:0}.home-section-title .hint{font-size:11px;color:#72869a}
.home-main-grid{display:grid;grid-template-columns:minmax(0,3fr) minmax(260px,1fr);gap:14px}.home-machines{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.home-machine{border-radius:18px;padding:17px;color:#fff;min-height:205px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 10px 24px rgba(23,60,95,.13);cursor:pointer;transition:transform .16s ease,box-shadow .16s ease;position:relative;overflow:hidden}.home-machine:hover{transform:translateY(-3px);box-shadow:0 15px 28px rgba(23,60,95,.18)}.home-machine:after{content:"";position:absolute;right:-35px;bottom:-50px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.10)}.home-machine.ps07{background:linear-gradient(145deg,#0f5f9d,#1688d0)}.home-machine.ps05{background:linear-gradient(145deg,#08784c,#17a56a)}.home-machine.ss{background:linear-gradient(145deg,#5631a9,#7a49d7)}.home-machine .machine-tag{font-size:11px;font-weight:800;opacity:.8;text-transform:uppercase;letter-spacing:1px}.home-machine h3{font-size:28px;margin:6px 0 4px}.home-machine p{font-size:11px;line-height:1.45;opacity:.9;max-width:210px;margin:0}.home-machine .machine-metrics{display:flex;gap:16px;margin-top:14px}.home-machine .metric strong{display:block;font-size:15px}.home-machine .metric span{font-size:9px;opacity:.75}.home-machine button{align-self:flex-start;border:1px solid rgba(255,255,255,.55);background:#fff;color:#153f63;border-radius:9px;padding:9px 14px;font-weight:900;cursor:pointer;position:relative;z-index:2}.home-commit{background:#fff;border:1px solid #d8e4ee;border-radius:18px;padding:18px;box-shadow:0 7px 20px rgba(31,65,94,.07)}.home-commit h3{font-size:18px;color:#173c5f;margin-bottom:12px}.home-commit-item{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid #edf2f6}.home-commit-item:last-child{border-bottom:0}.home-commit-icon{width:31px;height:31px;border-radius:9px;background:#e8f3fb;color:#1476b9;display:flex;align-items:center;justify-content:center;font-weight:900}.home-commit-item strong{display:block;font-size:12px;color:#214563}.home-commit-item span{font-size:10px;color:#74879a}
.home-footer{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:13px 18px;border-radius:16px;background:linear-gradient(90deg,#0d355b,#126da4);color:#fff}.home-footer-values{display:flex;gap:20px;flex-wrap:wrap;font-size:11px;font-weight:800}.home-footer-motto{font-size:16px;font-weight:900;font-style:italic;white-space:nowrap}
@media(max-width:1200px){.home-kpis{grid-template-columns:repeat(3,1fr)}.home-main-grid{grid-template-columns:1fr}.home-machines{grid-template-columns:repeat(3,1fr)}}
@media(max-width:800px){.home-top-row{flex-direction:column}.home-kpis{grid-template-columns:repeat(2,1fr)}.home-machines{grid-template-columns:1fr}.home-footer{flex-direction:column;align-items:flex-start}.home-footer-motto{white-space:normal}.home-title{font-size:26px}}

/* KPI & Financial Impact */
.kfi-shell{display:grid;gap:16px}
.kfi-top{background:linear-gradient(135deg,#0f2947,#1d5c87);color:#fff;border-radius:20px;padding:20px;box-shadow:0 12px 30px #10253f24}
.kfi-topline{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;flex-wrap:wrap}
.kfi-eyebrow{font-size:11px;letter-spacing:1.6px;text-transform:uppercase;opacity:.78;font-weight:800}
.kfi-title{font-size:28px;font-weight:900;margin:3px 0 5px}
.kfi-sub{font-size:13px;opacity:.82}
.kfi-live{padding:8px 11px;border-radius:999px;background:#ffffff18;border:1px solid #ffffff30;font-size:12px;font-weight:800}
.kfi-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-top:17px}
.kfi-tab{border:1px solid #ffffff35;background:#ffffff10;color:#fff;border-radius:10px;padding:9px 13px;font-weight:800;cursor:pointer}
.kfi-tab.active{background:#fff;color:#123554;border-color:#fff}
.kfi-summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kfi-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px;box-shadow:0 5px 18px #17324a0b}
.kfi-card .small{font-size:11px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.7px}
.kfi-card .big{font-size:24px;font-weight:900;margin-top:5px}
.kfi-card .subline{font-size:11px;color:var(--muted);margin-top:3px}
.kfi-panel{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 5px 18px #17324a0b}
.kfi-panel-head{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap}
.kfi-panel-head h2{margin:0;font-size:18px}
.kfi-panel-head .hint{font-size:11px;color:var(--muted)}
.kfi-table-wrap{overflow:auto}
.kfi-table{width:100%;border-collapse:separate;border-spacing:0;min-width:980px;font-size:12px}
.kfi-table th{position:sticky;top:0;background:#102d4f;color:#fff;padding:10px 9px;text-align:center;white-space:nowrap;font-size:11px;z-index:2}
.kfi-table th:first-child,.kfi-table th:nth-child(2){text-align:left}
.kfi-table td{padding:9px;border-bottom:1px solid #e8eef4;text-align:center;white-space:nowrap}
.kfi-table td:first-child{text-align:center;color:#6b7b8e;font-weight:800;width:45px}
.kfi-table td:nth-child(2){text-align:left;font-weight:800;color:#213a55;min-width:225px;position:sticky;left:0;background:#fff;z-index:1}
.kfi-table tr:hover td{background:#f7fbff}
.kfi-num{font-variant-numeric:tabular-nums}
.kfi-good{background:#dff4e7!important;color:#08783f!important;font-weight:900}
.kfi-bad{background:#ffe2e5!important;color:#b42335!important;font-weight:900}
.kfi-neutral{background:#eef2f6!important;color:#718096!important;font-weight:800}
.kfi-ytd{background:#f2f7fc!important;font-weight:900;border-left:2px solid #b9cde0}
.kfi-current{box-shadow:inset 0 -3px 0 #1b78c2}
.kfi-fi-table{min-width:1100px}
.kfi-fi-table td:nth-child(2){min-width:210px}
.kfi-fi-pos{background:#e0f5e8!important;color:#08783f!important;font-weight:900}
.kfi-fi-neg{background:#ffe3e5!important;color:#b42335!important;font-weight:900}
.kfi-fi-zero{background:#eef2f6!important;color:#718096!important;font-weight:800}
.kfi-total td{font-size:13px;font-weight:900;border-top:2px solid #8fa8be}
.kfi-note{padding:10px 16px;font-size:11px;color:var(--muted);background:#f7fafc;border-top:1px solid var(--line)}
.kfi-legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;font-weight:800;color:#52677d}
.kfi-dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px}
@media(max-width:900px){.kfi-summary{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.kfi-summary{grid-template-columns:1fr 1fr}.kfi-title{font-size:22px}}

.kfi-machine-panel{border:1px solid #d9e4ee}
.kfi-machine-head{padding:15px 18px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;background:linear-gradient(90deg,#f6faff,#ffffff);border-bottom:1px solid var(--line)}
.kfi-machine-badge{display:inline-flex;align-items:center;padding:5px 9px;border-radius:999px;background:#e8f2fb;color:#12598a;font-size:10px;font-weight:900;letter-spacing:.7px;text-transform:uppercase;margin-right:8px}
.kfi-machine-title{display:inline;font-size:19px;font-weight:900;color:#183b59}
.kfi-machine-hint{font-size:11px;color:var(--muted);margin-top:5px}
.kfi-machine-latest{min-width:155px;text-align:right;padding:9px 12px;border-radius:12px;background:#fff;border:1px solid #dce7ef}
.kfi-machine-latest span,.kfi-machine-latest small{display:block;color:var(--muted);font-size:10px;font-weight:800}
.kfi-machine-latest strong{display:block;font-size:17px;color:#173c5a;margin:2px 0}
.kfi-section-title{display:flex;align-items:center;gap:9px;font-size:18px;font-weight:900;color:#173b59;margin:5px 0 -5px}
.kfi-section-title span{display:inline-flex;width:28px;height:28px;border-radius:9px;align-items:center;justify-content:center;background:#123e62;color:#fff;font-size:11px}
.kfi-target{background:#eef5fb!important;color:#245777!important;font-weight:900;border-left:2px solid #a9c4da;border-right:2px solid #a9c4da}
.kfi-financial-panel{overflow:hidden}
.kfi-financial-groups{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px;background:#f5f8fb}
.kfi-fi-group{background:#fff;border:1px solid #dbe6ef;border-radius:14px;overflow:hidden;box-shadow:0 4px 14px #17324a0a}
.kfi-fi-group-head{padding:11px 13px;display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px solid #e3ebf2;background:#fbfdff}
.kfi-fi-group-head strong{font-size:14px;color:#1a3d5a}
.kfi-fi-mini{font-size:10px;color:var(--muted);font-weight:800}
.kfi-fi-table{min-width:930px}
.kfi-fi-table th{padding:8px 7px;font-size:10px}
.kfi-fi-table td{padding:7px;font-size:11px}
.kfi-fi-table td:nth-child(2){min-width:190px}
.kfi-fi-target{background:#eef5fb!important;color:#245777!important;border-left:2px solid #a9c4da;border-right:2px solid #a9c4da}
.kfi-legend-box{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:12px 14px;background:#fff;border:1px solid var(--line);border-radius:15px}
.kfi-legend-pill{display:inline-block;padding:4px 7px;border-radius:6px;font-size:9px;font-weight:900;margin-right:5px}
.kfi-legend-pill.good{background:#dff4e7;color:#08783f}.kfi-legend-pill.bad{background:#ffe2e5;color:#b42335}.kfi-legend-pill.neutral{background:#eef2f6;color:#718096}
@media(max-width:1000px){.kfi-financial-groups{grid-template-columns:1fr}.kfi-legend-box{grid-template-columns:1fr}}

.machine-grid {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:16px;
  margin-top:18px;
}

.machine {
  background:#fff;
  border:1px solid var(--line);
  border-radius:16px;
  padding:18px;
  cursor:pointer;
  box-shadow:0 4px 16px #17324a0b;
  transition:.2s;
}

.machine:hover {
  transform:translateY(-3px);
  box-shadow:0 10px 28px #17324a18;
}

.num {
  width:42px;
  height:42px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:12px;
  background:#e8f2fb;
  color:#1563a4;
  font-weight:900;
  font-size:20px;
}

.machine-title {
  margin-top:14px;
  font-size:18px;
  font-weight:800;
}

.machine-desc {
  color:var(--muted);
  font-size:13px;
  line-height:1.4;
  margin-top:6px;
}

.kpis {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:12px;
  margin:16px 0;
}

.kpi {
  background:#fff;
  border:1px solid var(--line);
  border-radius:14px;
  padding:14px;
}

.kpi .label {
  font-size:12px;
  color:var(--muted);
}

.kpi .value {
  font-size:22px;
  font-weight:900;
  margin-top:5px;
}

.section {
  margin-top:18px;
}

.section-head {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  margin-bottom:10px;
}

.cards {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(420px,1fr));
  gap:16px;
}

.chart-card {
  background:#fff;
  border:1px solid var(--line);
  border-radius:16px;
  padding:14px;
  min-height:360px;
}

.chart-wrap {
  height:300px;
  position:relative;
}
.other-chart-card .chart-wrap{height:360px}
.other-chart-card{overflow:hidden}
.other-ytd{display:flex;gap:8px;flex-wrap:wrap;margin-top:5px;font-size:11px;font-weight:900;color:#245777}
.other-ytd span{padding:4px 8px;border-radius:999px;background:#eef6fd;border:1px solid #cfe1f1}
.other-ytd strong{color:#123e62}


/* Executive machine performance charts */
.exec-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:18px}
.exec-card{background:#fff;border:1px solid #d8e4ee;border-radius:18px;padding:14px;box-shadow:0 7px 22px #17324a0b;min-height:390px}
.exec-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px}
.exec-head h3{font-size:17px;color:#163d61}
.exec-badge{font-size:10px;font-weight:900;padding:6px 9px;border-radius:999px;background:#eef6fd;color:#1665a0;white-space:nowrap}
.exec-chart{height:360px;position:relative}
.exec-note{font-size:10px;color:#71849a;margin-top:5px}
.exec-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:6px 0 8px}.exec-sum{border:1px solid #d9e5ef;border-radius:10px;padding:7px 8px;text-align:center;background:#f8fbfe}.exec-sum .v{font-size:15px;font-weight:900;line-height:1.05}.exec-sum .l{font-size:8px;font-weight:800;color:#647b91;margin-top:3px}.exec-sum.bad{background:#fff3f4;border-color:#ffc4cb}.exec-sum.good{background:#effaf4;border-color:#b9e8ce}.exec-sum.target{background:#eef6fd;border-color:#c4def3}
@media(max-width:900px){.exec-grid{grid-template-columns:1fr}}
.table-card {
  background:#fff;
  border:1px solid var(--line);
  border-radius:16px;
  padding:14px;
  overflow:auto;
  margin-top:16px;
}

table {
  border-collapse:collapse;
  width:100%;
  min-width:900px;
}

th,td {
  border-bottom:1px solid #e8eef4;
  padding:7px 8px;
  text-align:right;
  font-size:12px;
  white-space:nowrap;
}

th:first-child,
td:first-child {
  text-align:left;
  position:sticky;
  left:0;
  background:#fff;
}

thead th {
  background:#f4f7fa;
  font-weight:800;
  position:sticky;
  top:0;
}



.downtime-wrap {
  margin-top:18px;
}

.downtime-card {
  background:linear-gradient(135deg,#ffffff,#f7fbff);
  border:1px solid var(--line);
  border-radius:18px;
  padding:16px;
  box-shadow:0 7px 24px #17324a0b;
}

.downtime-head {
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:15px;
  margin-bottom:12px;
}

.downtime-badge {
  display:inline-flex;
  align-items:center;
  gap:7px;
  padding:7px 10px;
  border-radius:999px;
  background:#edf6ff;
  color:#1767a8;
  font-size:11px;
  font-weight:800;
}

.downtime-grid {
  display:grid;
  grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);
  gap:16px;
}

.downtime-panel {
  background:#fff;
  border:1px solid var(--line);
  border-radius:15px;
  padding:13px;
}

.downtime-panel h3 {
  font-size:14px;
  margin-bottom:4px;
}

.downtime-chart-wrap {
  height:330px;
  position:relative;
}

.downtime-note {
  font-size:11px;
  color:var(--muted);
  margin-top:7px;
}

.downtime-select {
  margin-top:8px;
  display:flex;
  flex-wrap:wrap;

const charts = {};

const pct = v =>
  v == null ? "—" : (Number(v) * 100).toFixed(2) + "%";

const ton = v =>
  v == null ? "—" :
  Number(v).toLocaleString(undefined,{
    maximumFractionDigits:2
  });

function destroyCharts() {
  Object.values(charts).forEach(c => {
    try {
      c.destroy();
    } catch(e) {}
  });

  for(const k of Object.keys(charts)) {
    delete charts[k];
  }
}

function showHome() {
  destroyCharts();

  document.getElementById("detail").classList.remove("active");
  document.getElementById("home").classList.add("active");

  window.scrollTo(0,0);
}

function machineCard(id,num,name,desc) {
  return `
    <div class="machine" onclick="openMachine('${id}')">
      <div class="num">${num}</div>
      <div class="machine-title">${name}</div>
      <div class="machine-desc">${desc}</div>
    </div>
  `;
}

function avg(a) {
  const x = a.filter(v =>
    typeof v === "number" &&
    !Number.isNaN(v)
  );

  return x.reduce((s,v) => s + v,0) / (x.length || 1);
}

function makeChart(id,labels,series,title) {

  const ctx = document.getElementById(id);

  if(!ctx) return;

  charts[id] = new Chart(ctx,{
    plugins:[lineValueLabelPlugin],
    type:"line",

    data:{
      labels,

      datasets:series.map(s => ({
        label:s.label,
        data:s.data,
        borderColor:s.borderColor,
        backgroundColor:s.backgroundColor || s.borderColor,
        borderWidth:s.borderWidth || 2,
        pointRadius:2,
        pointHoverRadius:4,
        tension:.25,
        fill:false,
        yAxisID:s.yAxisID || "y"
      }))
    },

    options:{
      responsive:true,
      maintainAspectRatio:false,

      interaction:{
        mode:"index",
        intersect:false
      },

      plugins:{
        legend:{
          position:"bottom"
        },

        title:{
          display:true,
          text:title,
          font:{
            size:15,
            weight:"700"
          }
        }
      }
    }
  });
}


const otherBarLabelPlugin={id:'otherBarLabelPlugin',afterDatasetsDraw(chart){
  const {ctx}=chart; ctx.save();
  chart.data.datasets.forEach((ds,di)=>{
    const meta=chart.getDatasetMeta(di); if(meta.hidden) return;
    meta.data.forEach((bar,i)=>{
      const raw=ds.data[i]; if(typeof raw!=='number' || !isFinite(raw) || raw===0) return;
      const p=bar.getProps(['x','y'],true);
      const txt=Number(raw).toFixed(2);
      ctx.font='900 10px Segoe UI,Arial';
      ctx.textAlign='center'; ctx.textBaseline='bottom';
      ctx.lineWidth=3; ctx.strokeStyle='rgba(255,255,255,.92)';
      ctx.fillStyle=ds.borderColor || '#173c5f';
      ctx.strokeText(txt,p.x,p.y-5-(di*11));
      ctx.fillText(txt,p.x,p.y-5-(di*11));
    });
  }); ctx.restore();
}};

  </div>`;
}
function makeOtherBarChart(id,labels,series,title){
  const ctx=document.getElementById(id); if(!ctx)return;
  if(charts[id]) charts[id].destroy();
  charts[id]=new Chart(ctx.getContext('2d'),{
    type:'bar',
    plugins:[otherBarLabelPlugin],
    data:{labels,datasets:series.map(s=>({
      label:s.label,data:s.data,backgroundColor:s.backgroundColor,borderColor:s.borderColor||s.backgroundColor,
      borderWidth:1,borderRadius:5,maxBarThickness:22
    }))},
    options:{
      responsive:true,maintainAspectRatio:false,
      interaction:{mode:'index',intersect:false},
      plugins:{legend:{position:'bottom'},title:{display:false},tooltip:{callbacks:{label:c=>` ${c.dataset.label}: ${Number(c.raw).toFixed(2)} T`}}},
      scales:{
        x:{ticks:{color:'#506a84',font:{size:10,weight:'700'},maxRotation:45,minRotation:45},grid:{color:'#e7edf4'}},
        y:{beginAtZero:true,title:{display:true,text:'Tons'},ticks:{color:'#506a84',font:{size:10},callback:v=>Number(v).toFixed(0)},grid:{color:'#e7edf4'}}
      }
    }
  });
}
function makeOtherBarCountChart(id,labels,series,title){
  const ctx=document.getElementById(id); if(!ctx)return;
  if(charts[id]) charts[id].destroy();
  charts[id]=new Chart(ctx.getContext('2d'),{
    type:'bar',
    plugins:[otherBarLabelPlugin],
    data:{labels,datasets:series.map(s=>({
      label:s.label,data:s.data,backgroundColor:s.backgroundColor,borderColor:s.borderColor||s.backgroundColor,
      borderWidth:1,borderRadius:5,maxBarThickness:28
    }))},

      responsive:true,maintainAspectRatio:false,
      interaction:{mode:'index',intersect:false},

      scales:{
        x:{ticks:{color:'#506a84',font:{size:10,weight:'700'},maxRotation:45,minRotation:45},grid:{color:'#e7edf4'}},
        y:{beginAtZero:true,title:{display:true,text:'Count'},ticks:{color:'#506a84',font:{size:10}},grid:{color:'#e7edf4'}}
      }
    }
  });
}

function kpi(label,value) {
  return `
    <div class="kpi">
      <div class="label">${label}</div>
      <div class="value">${value}</div>
    </div>
  `;
}

function makeTable(title,labels,rows,formatters=[]) {

  let head =
    `<th>Metric</th>` +
    labels.map(x => `<th>${x}</th>`).join("");

  let body =
    rows.map((r,i) => `
      <tr>

function drawDowntime(id, machineName, data) {
  if (!data || !data.departments || !data.departments.length) return;

  const deptCanvas = document.getElementById(id+"DtDept");
  const reasonCanvas = document.getElementById(id+"DtReason");
  if (!deptCanvas || !reasonCanvas) return;

  const deptLabels = data.departments;
  const deptHours = data.departmentHours;
  let selected = deptLabels[0];

  const makeReason = (department) => {
    selected = department;
    const items = (data.reasons && data.reasons[department]) || [];
    const labels = items.map(x => x[0]);
    const values = items.map(x => x[1]);
    const title = document.getElementById(id+"DtReasonTitle");
    if (title) title.textContent = `2. Reason Breakdown — ${department}`;

    if (charts[id+"DtReason"]) charts[id+"DtReason"].destroy();
    charts[id+"DtReason"] = new Chart(reasonCanvas.getContext("2d"), {
      plugins:[valueLabelPlugin],
      type:"bar",
      data:{
        labels,
        datasets:[{
          label:"Downtime (Hrs)",
          data:values,
          borderWidth:1,
          borderRadius:7,
          maxBarThickness:32,
          backgroundColor:"rgba(214,61,82,.72)",
          borderColor:"rgba(214,61,82,1)"
        }]
      },
      options:{
        indexAxis:"y",
        responsive:true,
        maintainAspectRatio:false,
        plugins:{
          legend:{display:false},
          tooltip:{callbacks:{label:ctx=>` ${Number(ctx.raw).toFixed(2)} Hrs`}}
        },
        scales:{
          x:{beginAtZero:true,title:{display:true,text:"Hours"},grid:{color:"#e7edf4"}},
          y:{ticks:{color:"#334e68"},grid:{display:false}}
        }
      }
    });

    document.querySelectorAll("#"+id+"DtChips .dt-chip").forEach(btn=>btn.classList.toggle("active",btn.dataset.dept===department));
  };

  charts[id+"DtDept"] = new Chart(deptCanvas.getContext("2d"), {
    plugins:[valueLabelPlugin],
    type:"bar",
    data:{
      labels:deptLabels,
      datasets:[{
        label:"Downtime (Hrs)",
        data:deptHours,
        borderWidth:1,
        borderRadius:9,
        maxBarThickness:38,
        backgroundColor:deptLabels.map((_,i)=>i===0?"rgba(208,139,25,.82)":"rgba(23,118,210,.68)"),
        borderColor:deptLabels.map((_,i)=>i===0?"rgba(208,139,25,1)":"rgba(23,118,210,1)")
      }]
    },
    options:{
      indexAxis:"y",
      responsive:true,
      maintainAspectRatio:false,
      onClick:(evt, elements)=>{
        if(elements.length) makeReason(deptLabels[elements[0].index]);
      },
      plugins:{
        legend:{display:false},
        tooltip:{callbacks:{label:ctx=>` ${Number(ctx.raw).toFixed(2)} Hrs`}}
      },
      scales:{
        x:{beginAtZero:true,title:{display:true,text:"Hours"},grid:{color:"#e7edf4"}},
        y:{ticks:{color:"#334e68",font:{weight:"700"}},grid:{display:false}}
      }
    }
  });

  const chips = document.getElementById(id+"DtChips");
  if (chips) {
    chips.innerHTML = deptLabels.map(d=>`<button class="dt-chip" data-dept="${String(d).replace(/"/g,'&quot;')}">${d}</button>`).join("");
    chips.querySelectorAll(".dt-chip").forEach(btn=>btn.addEventListener("click",()=>makeReason(btn.dataset.dept)));
  }
  makeReason(selected);
}

function rejectionIntelSection(id, title, data){
  if(!data || !data.rows || !data.rows.length) return '';

  const rows = data.rows;
  const maxYtd = Math.max(...rows.map(r=>r.ytd),1);
  const totalYtd = rows.reduce((a,r)=>a+r.ytd,0);
  let rankRows='';
  rows.forEach((r,i)=>{
    const cur = latest>=0 ? (r.months[latest]||0) : 0;
    const prev = latest>0 ? (r.months[latest-1]||0) : 0;
    const st = rejStatus(cur,prev,latest<=0);
    rankRows += `<div class="rej-rank-row">
      <div class="rej-rank-num">${String(i+1).padStart(2,'0')}</div>
      <div><div class="rej-rank-reason" title="${rejEsc(r.reason)}">${rejEsc(r.reason)}</div><div class="rej-rank-bar"><div class="rej-rank-fill" style="width:${Math.max(2,(r.ytd/maxYtd)*100)}%"></div></div></div>
      <div class="rej-rank-ytd"><small>2025</small><br>${rejFmt(r.y2025)} T</div>
      <div class="rej-rank-ytd"><small>YTD-26</small><br>${rejFmt(r.ytd)} T</div>
      <div class="rej-rank-current ${st.cls}">${rejFmt(cur)} T<br>${st.icon} ${latestLabel ? rejEsc(latestLabel) : ''}</div>
    </div>`;
  });
  let head=`<tr><th>Reason</th><th>2025<br>(Tons)</th>`;
  data.months.forEach((m,i)=>head += `<th>${rejEsc(m)}</th>`);
  head += `<th>YTD-26<br>(Tons)</th></tr>`;
  let body='';
  rows.forEach(r=>{
    body += `<tr><td class="reason">${rejEsc(r.reason)}</td><td class="rej-cell-2025">${r.y2025===0?'-':rejFmt(r.y2025)}</td>`;
    r.months.forEach((v,i)=>{
      const cur=Number(v||0);
      if(i===0) body += `<td class="rej-cell-neutral">${cur===0?'-':rejFmt(cur)}</td>`;
      else { const prev=Number(r.months[i-1]||0); const cls=cur>prev?'rej-cell-up':'rej-cell-down'; body += `<td class="${cls}" title="${rejEsc(cur>prev?'Increase vs '+data.months[i-1]:'Decrease / Same vs '+data.months[i-1])}">${cur===0?'-':rejFmt(cur)}</td>`; }
    });
    body += `<td class="rej-cell-ytd">${rejFmt(r.ytd)}</td></tr>`;
  });
  const total2025 = rows.reduce((a,r)=>a+(Number(r.y2025)||0),0);
  let totals=`<tr><td class="reason">Total</td><td class="rej-cell-2025">${total2025===0?'-':rejFmt(total2025)}</td>`;
  for(let i=0;i<data.months.length;i++){
    const t=rows.reduce((a,r)=>a+(Number(r.months[i])||0),0);
    if(i===0) totals += `<td>${t===0?'-':rejFmt(t)}</td>`;
    else { const prev=rows.reduce((a,r)=>a+(Number(r.months[i-1])||0),0); totals += `<td class="${t>prev?'rej-cell-up':'rej-cell-down'}">${t===0?'-':rejFmt(t)}</td>`; }
  }
  totals += `<td class="rej-cell-ytd">${rejFmt(totalYtd)}</td></tr>`;
  return `<div class="rej-intel-card">
    <div class="rej-intel-head"><div><h2>${rejEsc(title)}</h2><div class="sub">YTD 2026 • Highest to Lowest • ${latestLabel ? 'Latest: '+rejEsc(latestLabel) : ''}</div></div><div class="rej-intel-badge">Source: Rej Table</div></div>
    <div class="rej-intel-grid">
      <div class="rej-rank"><div class="rej-rank-title">YTD Rejection Ranking</div>${rankRows}<div class="rej-total"><span>Total YTD Rejection</span><span>${rejFmt(totalYtd)} T</span></div></div>
      <div class="rej-heat"><div class="rej-heat-title">Monthly Rejection Trend — vs Previous Month</div><table><thead>${head}</thead><tbody>${body}</tbody><tfoot>${totals}</tfoot></table><div class="rej-legend"><span><i class="rej-dot red"></i>Red = increase vs previous month</span><span><i class="rej-dot green"></i>Green = decrease or same</span><span><i class="rej-dot gray"></i>Jan = no comparison</span></div></div>
    </div>
  </div>`;
}
function rejectionIntelForMachine(id, name){
  const key = name === 'PS-05' ? 'ps05' : name === 'PS-07' ? 'ps07' : null;
  if(!key || !D.rejectionIntel || !D.rejectionIntel[key]) return '';
  const x=D.rejectionIntel[key];
  return `<div class="rej-intel-wrap">${rejectionIntelSection(id+'Own', x.own.title, x.own)}${rejectionIntelSection(id+'Line', x.line.title, x.line)}</div>`;
}


function kfiFmt(v, type){
  if(v===null || v===undefined || Number.isNaN(Number(v))) return "—";
  if(type === "pct") return (Number(v)*100).toFixed(2)+"%";
  if(type === "num") return Number(v).toLocaleString(undefined,{maximumFractionDigits:3});
  return Number(v).toLocaleString(undefined,{maximumFractionDigits:2});
}

function kfiStatus(v,target,higherBetter){
  if(v===null || v===undefined || target===null || target===undefined || Number.isNaN(Number(target))) return 'neutral';
  const ok = higherBetter ? Number(v)>=Number(target) : Number(v)<=Number(target);
  return ok ? 'good' : 'bad';
}

function renderKpiFinancial(p){
  const K = D.kpiTracker || {};
  const F = D.financialImpact || {};
  const machineOrder = ['slitter','ps07','ps05','ss'];
  const machineNames = machineOrder.filter(id => K.machines && K.machines[id]);

  const statusForYear = (value, target, higherBetter, baseline, useBaseline) => {
    if(value===null || value===undefined || Number.isNaN(Number(value))) return 'neutral';
    if(target!==null && target!==undefined && !Number.isNaN(Number(target))) {
      return kfiStatus(value,target,higherBetter);
    }
    if(useBaseline && baseline!==null && baseline!==undefined && !Number.isNaN(Number(baseline))) {
      return higherBetter ? (Number(value)>=Number(baseline)?'good':'bad') : (Number(value)<=Number(baseline)?'good':'bad');
    }
    return 'neutral';
  };

  const statusForMonth = (value, target, higherBetter, previous) => {
    if(value===null || value===undefined || Number.isNaN(Number(value))) return 'neutral';
    if(target!==null && target!==undefined && !Number.isNaN(Number(target))) {
      return kfiStatus(value,target,higherBetter);
    }
    if(previous!==null && previous!==undefined && !Number.isNaN(Number(previous))) {
      return higherBetter ? (Number(value)>=Number(previous)?'good':'bad') : (Number(value)<=Number(previous)?'good':'bad');
    }
    return 'neutral';
  };

  const cls=status=>status==='good'?'kfi-good':status==='bad'?'kfi-bad':'kfi-neutral';

  const renderKpiTable = (M) => {
    const months=M.months||[];
    const rows=M.rows||[];
    const latest=months.length?months[months.length-1]:'—';
    const latestGood=rows.filter(r=>statusForMonth(r.current,r.target,r.higherBetter,months.length>1?r.months[months.length-2]:null)==='good').length;

    const kpiRows=rows.map((r,i)=>{
      const y25Status=statusForYear(r.y2025,r.target,r.higherBetter,null,false);
      const y26Status=statusForYear(r.y2026,r.target,r.higherBetter,r.y2025,true);
      const cells=months.map((mo,j)=>{
        const v=r.months[j];
        const prev=j>0?r.months[j-1]:null;
        const st=statusForMonth(v,r.target,r.higherBetter,prev);
        return `<td class="kfi-num ${cls(st)} ${j===months.length-1?'kfi-current':''}">${kfiFmt(v,r.format)}</td>`;
      }).join('');
      return `<tr>
        <td>${i+1}</td>
        <td>${r.label}</td>
        <td class="kfi-num ${cls(y25Status)}">${kfiFmt(r.y2025,r.format)}</td>
        <td class="kfi-num kfi-target">${kfiFmt(r.target,r.format)}</td>
        <td class="kfi-num ${cls(y26Status)}">${kfiFmt(r.y2026,r.format)}</td>
        ${cells}
        <td class="kfi-num kfi-ytd ${cls(y26Status)}">${kfiFmt(r.ytd,r.format)}</td>
      </tr>`;
    }).join('');

    return `
      <div class="kfi-panel kfi-machine-panel">
        <div class="kfi-machine-head">
          <div>
            <div class="kfi-machine-badge">${M.name}</div>
            <div class="kfi-machine-title">${M.name} KPI Tracker</div>
            <div class="kfi-machine-hint">2025 vs target • 2026 vs target • monthly performance</div>
          </div>
          <div class="kfi-machine-latest"><span>Latest</span><strong>${latest}</strong><small>${latestGood} KPI(s) meeting/improving benchmark</small></div>
        </div>
        <div class="kfi-table-wrap">
          <table class="kfi-table kfi-kpi-table">
            <thead><tr>
              <th>S.No.</th><th>Performance Goal</th><th>2025</th><th>Target 2026</th><th>2026</th>
              ${months.map((x,i)=>`<th class="${i===months.length-1?'kfi-current':''}">${x}</th>`).join('')}
              <th>YTD 2026</th>
            </tr></thead>
            <tbody>${kpiRows}</tbody>
          </table>
        </div>
        <div class="kfi-note">Green = achieved/improved • Red = missed/worsened • Grey = no benchmark. For SLITTER rows without a target, monthly cells use month-to-month comparison.</div>
      </div>`;
  };

  const fiMonths=F.months||[];
  const fiRows=F.rows||[];
  const fiCell=(v, extra='')=>{
    const n=Number(v);
    const valid=v!==null && v!==undefined && !Number.isNaN(n);
    const c=!valid?'kfi-fi-zero':n>0?'kfi-fi-pos':n<0?'kfi-fi-neg':'kfi-fi-zero';
    // FI source is displayed in Rs-M using the same 2-decimal precision as the workbook.
    // Do not convert missing/error source values to zero.
    const txt=!valid?'—':n<0?'('+Math.abs(n).toFixed(2)+')':n.toFixed(2);
    return `<td class="kfi-num ${c} ${extra}">${txt}</td>`;
  };
  const fiBody=fiRows.map((r,i)=>`
    <tr>
      <td>${i+1}</td><td>${r.label}</td>
      ${fiCell(r.y2025)}${fiCell(r.y2026)}
      ${(r.months||[]).map(v=>fiCell(v)).join('')}
    </tr>`).join('');
  const t=F.total||{};
  const safeNum = v => (v===null || v===undefined || Number.isNaN(Number(v))) ? null : Number(v);
  const fiSummaryFmt = v => {
    const n=safeNum(v);
    if(n===null) return '—';
    return n<0 ? '('+Math.abs(n).toFixed(2)+')' : n.toFixed(2);
  };
  const total2025=safeNum(t.y2025);
  const total2026=safeNum(t.y2026);
  const latestFi=fiMonths.length?fiMonths[fiMonths.length-1]:'—';

  p.innerHTML=`
    <div class="kfi-shell">
      <div class="kfi-top">
        <div class="kfi-topline">
          <div>
            <div class="kfi-eyebrow">Management View</div>
            <div class="kfi-title">KPI & Financial Impact</div>
            <div class="kfi-sub">SLITTER • PS-07 • PS-05 • SS — all KPI sections on one page</div>
          </div>
          <div class="kfi-live">LIVE DATA • ${latestFi}</div>
        </div>
        <div class="kfi-summary">
          <div class="kfi-card"><div class="small">Machines</div><div class="big">${machineNames.length}</div><div class="subline">KPI sections combined</div></div>
          <div class="kfi-card"><div class="small">2025 Financial Impact</div><div class="big">${fiSummaryFmt(total2025)}</div><div class="subline">Rs-M • 2025 source total</div></div>
          <div class="kfi-card"><div class="small">2026 Financial Impact</div><div class="big">${fiSummaryFmt(total2026)}</div><div class="subline">Rs-M • 2026 source total</div></div>
          <div class="kfi-card"><div class="small">Latest FI Month</div><div class="big">${latestFi}</div><div class="subline">Latest available source month</div></div>
        </div>
      </div>

      <div class="kfi-section-title"><span>01</span> KPI Performance — All Machines</div>
      ${machineNames.map(id=>renderKpiTable(K.machines[id])).join('')}

      <div class="kfi-section-title"><span>02</span> Financial Impact</div>
      <div class="kfi-panel kfi-financial-panel">
        <div class="kfi-panel-head">
          <div><h2>Financial Impact — Rs-M</h2><div class="hint">2025 actual → 2026 actual → monthly view</div></div>
          <div class="kfi-legend"><span><i class="kfi-dot" style="background:#16945a"></i>Positive</span><span><i class="kfi-dot" style="background:#d63d52"></i>Negative</span><span><i class="kfi-dot" style="background:#94a3b8"></i>Zero / unavailable</span></div>
        </div>
        <div class="kfi-table-wrap">
          <table class="kfi-table kfi-fi-table">
            <thead><tr>
              <th>S.No.</th><th>Performance Goal</th><th class="fi-year-2025">2025</th><th class="fi-year-2026">2026</th>
              ${fiMonths.map((x,i)=>`<th class="fi-month ${i===fiMonths.length-1?'kfi-current':''}">${x}</th>`).join('')}
            </tr></thead>
            <tbody>${fiBody}</tbody>
            <tfoot><tr class="kfi-total">
              <td></td><td>Total Financial Impact</td>
              ${fiCell(t.y2025)}${fiCell(t.y2026)}
              ${(t.months||[]).map(v=>fiCell(v)).join('')}
            </tr></tfoot>
          </table>
        </div>
        <div class="kfi-note">Source: <strong>PS Production Report MTD → FI</strong>. Positive impact = green; negative impact = red and displayed in brackets. Monthly columns are shown only for months available in the FI tab.</div>
      </div>

      <div class="kfi-legend-box">
        <div><span class="kfi-legend-pill good">GREEN</span> Target achieved / improved</div>
        <div><span class="kfi-legend-pill bad">RED</span> Target missed / worsened / negative impact</div>
        <div><span class="kfi-legend-pill neutral">GREY</span> No target / unavailable / zero</div>
      </div>
    </div>`;
}


function boppPct(v){ return (Number(v||0)*100).toFixed(2)+'%'; }
function boppSummaryCard(label,value,cls){ return `<div class="bopp-summary-card ${cls||''}"><div class="val">${boppPct(value)}</div><div class="lab">${label}</div></div>`; }
function boppSummaryHTML(summary){
  const y25=summary.y2025, target=summary.target, ytd=summary.ytd2026;
  const ytdCls=(ytd!=null && target!=null && ytd<=target)?'good':'bad';
  return `<div class="bopp-summary">${boppSummaryCard('2025',''+y25,'bad')}${boppSummaryCard('Target 2026',target,'target')}${boppSummaryCard('YTD-2026',ytd,ytdCls)}</div>`;
}
const boppLabelPlugin={
  id:'boppLabelPlugin',
  afterDatasetsDraw(chart){
    const {ctx}=chart; ctx.save();
    ctx.font='800 9px Segoe UI, Arial, sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    chart.data.datasets.forEach((ds,di)=>{
      const meta=chart.getDatasetMeta(di); if(meta.hidden) return;
      meta.data.forEach((bar,i)=>{
        const raw=Number(ds.data[i]||0); if(!raw) return;
        const p=bar.getProps(['x','y','base'],true); const h=Math.abs(p.base-p.y);
        // Always label non-zero stack segments. Smaller segments use a smaller font so
        // values such as 0.10% / 0.11% / 0.20% are not silently omitted.
        const fs = h >= 12 ? 9 : (h >= 7 ? 7 : 6);
        ctx.font=`800 ${fs}px Segoe UI, Arial, sans-serif`;
        ctx.fillStyle='#fff';
        ctx.textBaseline='middle';
        ctx.fillText((raw*100).toFixed(2)+'%',p.x,(p.y+p.base)/2);
      });
    });
    // Total labels above each stack.
    const totals=chart.options.plugins.boppTotals||[];
    if(totals.length){
      ctx.font='900 11px Segoe UI, Arial, sans-serif';
      const target=Number(chart.options.plugins.boppTarget);
      const lastVisible=chart.data.datasets.length-1;
      const meta=chart.getDatasetMeta(lastVisible);
      meta.data.forEach((bar,i)=>{
        if(totals[i]==null) return;
        const p=bar.getProps(['x','y'],true);
        const total=Number(totals[i]);
        ctx.fillStyle=Number.isFinite(target) ? (total<=target ? '#07823d' : '#e32635') : '#173c5f';
        ctx.font='900 10px Segoe UI, Arial, sans-serif';
        const y=Math.max(13,p.y-9);
        ctx.fillText((total*100).toFixed(2)+'%',p.x,y);
      });
    }
    ctx.restore();
  }
};
function boppLegend(items,totalLabel){
  const totalPart=totalLabel?`<span class="bopp-legend-item"><i class="bopp-dot" style="background:#dce8f2;border:1px dashed #7992a8"></i>${totalLabel}</span>`:'';
  return `<div class="bopp-legend">${items.map(x=>`<span class="bopp-legend-item"><i class="bopp-dot" style="background:${x.color}"></i>${x.label}</span>`).join('')}${totalPart}</div>`;
}
function boppPanel(no,title,subtitle,summary,canvasId,legend,extraClass=''){
  return `<div class="bopp-panel ${extraClass}">
    <div class="bopp-panel-head"><div class="bopp-title-wrap"><div class="bopp-index">${no}</div><div><h2 class="bopp-title">${title}</h2><div class="bopp-subtitle">${subtitle}</div></div></div>${boppSummaryHTML(summary)}</div>
    <div class="bopp-chart-wrap"><canvas id="${canvasId}"></canvas></div>${legend}
  </div>`;
}
function drawBoppStack(id,labels,datasets,totals,maxY,target){
  const el=document.getElementById(id); if(!el) return;
  charts[id]=new Chart(el.getContext('2d'),{
    type:'bar', plugins:[boppLabelPlugin],
    data:{labels:labels.map(x=>x.replace('-20','-')),datasets:datasets.map(d=>({label:d.label,data:d.data,backgroundColor:d.color,borderColor:'#ffffff',borderWidth:1,stack:'bopp',borderRadius:4,maxBarThickness:30}))},
    options:{responsive:true,maintainAspectRatio:false,animation:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>` ${c.dataset.label}: ${boppPct(c.raw)}`}},boppTotals:totals,boppTarget:target},
      scales:{x:{stacked:true,grid:{display:false},ticks:{color:'#45637d',font:{size:9,weight:'800'},maxRotation:45,minRotation:45}},y:{stacked:true,beginAtZero:true,max:maxY,grid:{color:'#e3edf5'},ticks:{color:'#5c748a',font:{size:9,weight:'700'},callback:v=>(Number(v)*100).toFixed(1)+'%'},title:{display:true,text:'Percentage %',color:'#37556e',font:{size:10,weight:'900'}}}},
    }
  });
}
function drawBoppSingle(id,labels,values,maxY,target){
  const el=document.getElementById(id); if(!el) return;
  const barColors=values.map(v=>Number(v)<=Number(target)?'#16945a':'#d63d52');
  charts[id]=new Chart(el.getContext('2d'),{
    type:'bar',plugins:[boppLabelPlugin],data:{labels:labels.map(x=>x.replace('-20','-')),datasets:[{label:'Total Waste',data:values,backgroundColor:barColors,borderColor:barColors,borderWidth:1,borderRadius:6,maxBarThickness:34,stack:'bopp'}]},
    options:{responsive:true,maintainAspectRatio:false,animation:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>` Total Waste: ${boppPct(c.raw)}`}},boppTotals:values,boppTarget:target},scales:{x:{grid:{display:false},ticks:{color:'#45637d',font:{size:9,weight:'800'},maxRotation:45,minRotation:45}},y:{beginAtZero:true,max:maxY,grid:{color:'#e3edf5'},ticks:{color:'#5c748a',font:{size:9,weight:'700'},callback:v=>(Number(v)*100).toFixed(1)+'%'},title:{display:true,text:'Percentage %',color:'#37556e',font:{size:10,weight:'900'}}}}}
  });
}
function renderBopp(p){
  const B=D.boppDashboard;
  const blue1='#143f6b',blue2='#147dcc',blue3='#36aee8',blue4='#8fb7d3';
  const lineLegend=boppLegend([{label:'Slitter',color:blue1},{label:'Line-05',color:blue2},{label:'Line04',color:blue3}],'Over all Slitter');
  const slitterLegend=boppLegend([{label:'PS-05',color:blue1},{label:'PS-07',color:blue2},{label:'SS',color:blue4}],'Total Slitter');
  const wasteLegend=boppLegend([{label:'Line Waste',color:blue3},{label:'Slitter Waste',color:blue1}],'Total Waste');
  const fourthLegend=boppLegend([{label:'Total Slitter Waste % (Excl SS) Input',color:blue2}], '');
  p.innerHTML=`<div class="bopp-shell">
    ${boppPanel('01',"Slitter Rejection on Line's Prod.",'Basis: Line-04 + Line-05 production',B.line.summary,'boppLineChart',lineLegend)}
    ${boppPanel('02','Slitter Rejection % on Slitter Prod.','Basis: PS-05 + PS-07 + SS production',B.slitter.summary,'boppSlitterChart',slitterLegend)}
    ${boppPanel('03','Slitter Waste With SS Input %','Basis: Slitter input including SS',B.waste.summary,'boppWasteChart',wasteLegend)}
    ${boppPanel('04','Total Slitter Waste % (Excl SS) Input','',B.excludeSS.summary,'boppExcludeSSChart',fourthLegend,'bopp-fourth')}
  </div>`;
  drawBoppStack('boppLineChart',B.line.months.slice(12),[{label:'Slitter',data:B.line.components['Slitter'].slice(12),color:blue1},{label:'Line-05',data:B.line.components['Line-05'].slice(12),color:blue2},{label:'Line04',data:B.line.components['Line04'].slice(12),color:blue3}],B.line.total.slice(12),0.042,B.line.summary.target);
  drawBoppStack('boppSlitterChart',B.slitter.months.slice(12),[{label:'PS-05',data:B.slitter.components['PS-05'].slice(12),color:blue1},{label:'PS-07',data:B.slitter.components['PS-07'].slice(12),color:blue2},{label:'SS',data:B.slitter.components['SS'].slice(12),color:blue4}],B.slitter.total.slice(12),0.014,B.slitter.summary.target);
  drawBoppStack('boppWasteChart',B.waste.months.slice(12),[{label:'Line Waste',data:B.waste.components['Line Waste'].slice(12),color:blue3},{label:'Slitter Waste',data:B.waste.components['Slitter Waste'].slice(12),color:blue1}],B.waste.total.slice(12),0.08,B.waste.summary.target);
  drawBoppSingle('boppExcludeSSChart',B.excludeSS.months,B.excludeSS.values,0.08,B.excludeSS.summary.target);
}


function openMachine(id) {

  destroyCharts();

  document.getElementById("home")
    .classList.remove("active");

  const p = document.getElementById("detail");

  p.classList.add("active");

  window.scrollTo(0,0);

  if(id === "kpiFi") {
    renderKpiFinancial(p);
    p.insertAdjacentHTML('afterbegin', detailNav(id));
    return;
  }

  if(id === "other") {
    renderOther(p);
    p.insertAdjacentHTML('afterbegin', detailNav(id));
    return;
  }

  if(id === "bopp") {
    renderBopp(p);
    p.insertAdjacentHTML('afterbegin', detailNav(id));
    return;
  }


  const m = machines[id];

  let html = machineHeader(m.name,m.desc);

  // Requested executive sequence: Daily/MTM compliance → Rejection → Rejection table → Downtime → OEE → Waste → Trim/Leftover → Film-wise.
  if(m.planning) {
    html += planningSection("m"+id, m.name, m.planning);
  }

  html += mainSection(
    m.name,
    m.prod,
    m.rej,
    m.rejTarget,
    "m"+id,
    m.wPct,
    m.wTarget,
    m.rejSummary
  );

  if(m.name === "PS-05" || m.name === "PS-07") {
    html += rejectionIntelForMachine("m"+id, m.name);
  }

  if(m.downtime) {
    html += downtimeSection("m"+id, m.name, m.downtime);
  }

  if(m.mtmOEE) {
    html += mtmOEESection("m"+id, m.name, m.mtmOEE);
  }

  html += wasteSection(m.name,"m"+id,m.wTarget,m.wasteSummary);

  if(m.trim) {
    html += trimSection(
      "m"+id, m.name, m.trim, m.trimT, m.left, m.leftT, months, m.trimSummary, m.leftSummary
    );
  }

  if(m.wasteDetail) {
    html += wasteDetailSection("m"+id, m.name, m.wasteDetail);
  }


  p.innerHTML = detailNav(id) + html;


  if(m.name === "PS-05" || m.name === "PS-07" || m.name === "SS") {
    drawMachineRejection("m"+id+"rej", m.name, m.rejTarget);
    drawMachineWaste("m"+id+"waste", m.name, m.wTarget);
  }


  if(m.planning) {
    drawPlanning("m"+id, m.name, m.planning);
  }

  if(m.mtmOEE) {
    drawMtmOEE("m"+id, m.name, m.mtmOEE);
  }

  if(m.trim) {

    drawTrim(
      "m"+id,
      m.name,
      m.trim,
      m.trimT,
      m.left,
      m.leftT
    );

  }

  if(m.wasteDetail) {
    drawWasteDetail("m"+id, m.wasteDetail);
  }

  if(m.downtime) {
    drawDowntime("m"+id, m.name, m.downtime);
  }

}


function renderOther(p) {

  const ag5 = D.agingLine5;
  const bfg = D.bncFG;
  const bstd = D.bncSTD;
  const bt = D.bncTotal;

  const lps=D.lumsumPS, lss=D.lumsumSS, ltot=D.lumsumTotal;
  const lY=lps.slice(12,21).reduce((a,v)=>a+(typeof v==='number'?v:0),0);
  const lSY=lss.slice(12,21).reduce((a,v)=>a+(typeof v==='number'?v:0),0);
  const lTY=ltot.slice(12,21).reduce((a,v)=>a+(typeof v==='number'?v:0),0);
  const a4Y=ag4[20], a5Y=ag5[20];
  const bfgY=bfg.slice(12,21).reduce((a,v)=>a+(typeof v==='number'?v:0),0);
  const bstdY=bstd.slice(12,21).reduce((a,v)=>a+(typeof v==='number'?v:0),0);
  const btY=bt.slice(12,21).reduce((a,v)=>a+(typeof v==='number'?v:0),0);
  const s05Y=D.settingPS05.reduce((a,v)=>a+(Number(v)||0),0);
  const s07Y=D.settingPS07.reduce((a,v)=>a+(Number(v)||0),0);

  p.innerHTML =

      "OTHER DETL.",
      "Lumsum Sold, Aging Rack, BNC Production and Setting Change"
    ) +

    `<div class="exec-summary">
      <div class="exec-sum bad"><div class="v">${ton(D.lumsumTotal.slice(0,12).reduce((a,b)=>a+(typeof b==='number'?b:0),0))}</div><div class="l">2025 Lumsum</div></div>
      <div class="exec-sum good"><div class="v">${ton(lTY)}</div><div class="l">YTD-2026 Lumsum</div></div>
      <div class="exec-sum target"><div class="v">${ton(D.bncTotal.slice(0,12).reduce((a,b)=>a+(typeof b==='number'?b:0),0))}</div><div class="l">2025 BNC Total</div></div>
      <div class="exec-sum good"><div class="v">${ton(btY)}</div><div class="l">YTD-2026 BNC Total</div></div>
      <div class="exec-sum target"><div class="v">${ton(avg(D.settingPS05))}</div><div class="l">PS-05 Setting Avg</div></div>
      <div class="exec-sum target"><div class="v">${ton(avg(D.settingPS07))}</div><div class="l">PS-07 Setting Avg</div></div>
    </div>

    <div class="cards">
      ${otherChartCard(
        "otherLumsum",
        "Lumsum Sold Detail",
        "Monthly tons — PS rejection, SS small reels and total.",
        `<span>YTD-2026 PS Rej Sold: <strong>${lY.toFixed(2)} T</strong></span><span>YTD-2026 SS Small Reels: <strong>${lSY.toFixed(2)} T</strong></span><span>YTD-2026 Total: <strong>${lTY.toFixed(2)} T</strong></span>`
      )}
      ${otherChartCard(
        "otherAging",
        "Aging Rack Closing",
        "Monthly closing stock — Line 4 and Line 5.",
        `<span>YTD-2026 Line 4: <strong>${Number(a4Y).toFixed(2)} T</strong></span><span>Line 5: <strong>${Number(a5Y).toFixed(2)} T</strong></span>`
      )}
      ${otherChartCard(
        "otherBnc",
        "BNC Production",
        "Monthly production in tons — FG, STD and total.",
        `<span>YTD-2026 FG: <strong>${bfgY.toFixed(2)} T</strong></span><span>STD: <strong>${bstdY.toFixed(2)} T</strong></span><span>Total: <strong>${btY.toFixed(2)} T</strong></span>`
      )}
      ${otherChartCard(
        "otherSetting",
        "Setting Change",
        "Monthly setting changes — PS-05 and PS-07.",
        `<span>YTD-2026 PS-05: <strong>${s05Y.toFixed(0)}</strong></span><span>PS-07: <strong>${s07Y.toFixed(0)}</strong></span>`
      )}
    </div>
  `;

  makeOtherBarChart(
    "otherLumsum", months.slice(12),
    [
      {label:"Rej Lumsum PS",data:lps.slice(12),backgroundColor:"#d34d59"},
      {label:"SS Small Reels",data:lss.slice(12),backgroundColor:"#2d78b7"},
      {label:"Total",data:ltot.slice(12),backgroundColor:"#1a9a5a"}
    ], "Lumsum Sold Detail"
  );

  makeOtherBarChart(
    "otherAging", months.slice(12),
    [
      {label:"LINE4 Aging Open",data:ag4.slice(12),backgroundColor:"#2d78b7"},
      {label:"LINE5 Aging Open",data:ag5.slice(12),backgroundColor:"#d08b19"}
    ], "Aging Rack Stock Closing"
  );

  makeOtherBarChart(
    "otherBnc", months.slice(12),
    [
      {label:"FG Prod. Ton",data:bfg.slice(12),backgroundColor:"#2d78b7"},
      {label:"STD Prod.",data:bstd.slice(12),backgroundColor:"#9a54b7"},
      {label:"Total Prod. Ton",data:bt.slice(12),backgroundColor:"#1a9a5a"}
    ], "BNC Production"
  );

  makeOtherBarCountChart(
    "otherSetting", D.settingMonths,
    [
      {label:"PS-05",data:D.settingPS05,backgroundColor:"#2d78b7"},
      {label:"PS-07",data:D.settingPS07,backgroundColor:"#d34d59"}
    ], "Setting Change"
  );
}


renderHome();

</script>
